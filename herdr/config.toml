onboarding = false

# prefix キーを ctrl+b から変更（シェルのライン編集 Ctrl+b や Claude Code の task:background との競合回避）
keys.prefix = "ctrl+q"

[ui]
agent_panel_sort = "spaces"

[experimental]
# prefix モード中だけ入力ソースを英数レイアウトに切替え、抜けたら元の IME に戻す
# （日本語 IME が ON のままだと prefix コマンドが効かない問題への対策・macOS 専用）
switch_ascii_input_source_in_prefix = true

[ui.toast]
delivery = "herdr"
